<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WipeX — Secure Erasure & Forensic Recovery</title>
  <meta name="description" content="WipeX: integrated secure data erasure and forensic file recovery workstation.">
  <link rel="icon" type="image/svg+xml" href="img/wipex-logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Main">
    <a class="brand" href="#/overview" aria-label="WipeX home">
      <img class="brand-logo" src="img/wipex-logo.svg" alt="" width="34" height="34">
      <span class="brand-text"><span class="brand-name">WipeX</span><span class="brand-tag">Erase · Verify · Recover</span></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="engine" id="engine-status" title="Backend engine status"><span class="dot"></span><span class="engine-text">Connecting…</span></span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="shell">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open the menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <label class="demo-switch" id="demo-switch" title="Demo mode: practise the whole flow on sample disks and sample files; real drives cannot be erased">
        <input type="checkbox" id="demo-toggle" role="switch"><span class="switch-track"><span class="switch-knob"></span></span><span>Demo mode</span>
      </label>
      <button class="operator-chip" id="operator-chip" title="Switch the access profile">
        <span class="avatar" id="operator-avatar">·</span><span class="operator-name" id="operator-name">Opening…</span>
      </button>
    </header>
    <div class="admin-bar" id="admin-bar" hidden></div>
    <div class="demo-bar" id="demo-bar" hidden></div>

    <main class="page" id="page">
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-erase"></section>
      <section class="view" id="view-recovery"></section>
      <section class="view" id="view-cases"></section>
      <section class="view" id="view-audit"></section>
      <section class="view" id="view-verify"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>

  <div id="auth-root"></div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

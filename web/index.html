<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WipeX — Secure Erasure & Forensic Recovery</title>
  <meta name="description" content="WipeX: integrated secure data erasure and forensic file recovery workstation.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230e7470'/%3E%3Cpath d='M6 8h12M6 12h8M6 16h5' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview" aria-label="WipeX home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h9M5 17h5"/></svg>
        </span>
        <span class="brand-name">WipeX</span>
        
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="top-right">
        <span class="engine" id="engine-status" title="Backend engine status"><span class="dot"></span><span class="engine-text">Connecting…</span></span>
        <span class="access-tag" title="Restricted workstation tool: the engine accepts requests from this computer only, and every action is signed and logged">NTRO · controlled access</span>
        <button class="operator-chip" id="operator-chip" title="Switch the access profile">
          <span class="avatar" id="operator-avatar">·</span><span class="operator-name" id="operator-name">Opening…</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page" id="page">
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-drive"></section>
    <section class="view" id="view-files"></section>
    <section class="view" id="view-recovery"></section>
    <section class="view" id="view-cases"></section>
    <section class="view" id="view-audit"></section>
    <section class="view" id="view-verify"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <div id="auth-root"></div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
